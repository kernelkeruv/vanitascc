name: Mobile IoT static checks
on:
  push:
    branches: ["feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate HTML, PWA assets, and permission boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/device-lab.js
          node --check assets/js/site.js
          node --check service-worker.js
      - name: Exercise mock Web Bluetooth state machine
        run: node tests/test_device_lab_mock.cjs
